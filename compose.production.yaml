services:
  api:
    image: ${SIMAK_API_IMAGE:-ghcr.io/ferilee/simak-api}:${SIMAK_IMAGE_TAG:?SIMAK_IMAGE_TAG wajib diisi}
    environment:
      DATABASE_URL: ${SIMAK_DATABASE_URL:?SIMAK_DATABASE_URL wajib diisi}
      RUAS_AUTH_MODE: ${RUAS_AUTH_MODE:-internal-endpoint}
      RUAS_DATABASE_URL: ${RUAS_DATABASE_URL:-}
      RUAS_AUTH_ENDPOINT: ${RUAS_AUTH_ENDPOINT:-}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET wajib diisi}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN wajib diisi}
      RUSTFS_ENDPOINT: ${SIMAK_RUSTFS_ENDPOINT:-http://rustfs:9000}
      RUSTFS_PUBLIC_ENDPOINT: ${RUSTFS_PUBLIC_ENDPOINT:?RUSTFS_PUBLIC_ENDPOINT wajib diisi}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-simak}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY wajib diisi}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY wajib diisi}
      API_PORT: 3001
    networks:
      - simak
      - ferileenet
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ${SIMAK_WEB_IMAGE:-ghcr.io/ferilee/simak-web}:${SIMAK_IMAGE_TAG:?SIMAK_IMAGE_TAG wajib diisi}
    environment:
      NODE_ENV: production
    depends_on:
      - api
    networks:
      - simak
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  proxy:
    image: caddy:2
    ports:
      - "${SIMAK_HTTP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - simak_caddy_data:/data
      - simak_caddy_config:/config
    depends_on:
      - web
      - api
    networks:
      - simak
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    image: ${SIMAK_API_IMAGE:-ghcr.io/ferilee/simak-api}:${SIMAK_IMAGE_TAG:?SIMAK_IMAGE_TAG wajib diisi}
    profiles: ["ops"]
    environment:
      DATABASE_URL: ${SIMAK_DATABASE_URL:?SIMAK_DATABASE_URL wajib diisi}
    command: ["/app/packages/db/node_modules/.bin/drizzle-kit", "migrate", "--config", "/app/packages/db/drizzle.config.ts"]
    networks:
      - ferileenet

volumes:
  simak_caddy_data:
  simak_caddy_config:

networks:
  simak:
    name: simak-production
    driver: bridge
  ferileenet:
    external: true
