services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      - NODE_ENV=production
    depends_on:
      - api
    networks:
      - simak
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - DATABASE_URL=${SIMAK_DATABASE_URL:?SIMAK_DATABASE_URL wajib diisi; gunakan hostname mariadb pada network ferileenet}
      - RUAS_AUTH_MODE=${RUAS_AUTH_MODE:-internal-endpoint}
      - RUAS_DATABASE_URL=${RUAS_DATABASE_URL:-}
      - RUAS_AUTH_ENDPOINT=${RUAS_AUTH_ENDPOINT:-}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET wajib diisi; salin .env.example ke .env}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
      - RUSTFS_ENDPOINT=http://rustfs:9000
      - RUSTFS_BUCKET=${RUSTFS_BUCKET:-simak}
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfsadmin}
      - API_PORT=3001
    networks:
      - simak
      - ferileenet
    restart: unless-stopped

  proxy:
    image: caddy:2
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN:-simak.localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    networks:
      - simak
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

networks:
  simak:
    driver: bridge
  ferileenet:
    external: true
