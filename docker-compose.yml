services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      - NODE_ENV=production
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - DATABASE_URL=mysql://${MARIADB_USER:-simak}:${MARIADB_PASSWORD:-simak}@db:3306/${MARIADB_DATABASE:-simak}
      - RUAS_AUTH_MODE=${RUAS_AUTH_MODE:-internal-endpoint}
      - RUAS_DATABASE_URL=${RUAS_DATABASE_URL:-}
      - RUAS_AUTH_ENDPOINT=${RUAS_AUTH_ENDPOINT:-}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET wajib diisi; salin .env.example ke .env}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
      - RUSTFS_ENDPOINT=http://storage:9000
      - RUSTFS_BUCKET=${RUSTFS_BUCKET:-simak}
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfsadmin}
      - API_PORT=3001
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
    restart: unless-stopped

  db:
    image: mariadb:11.4
    environment:
      - MARIADB_DATABASE=${MARIADB_DATABASE:-simak}
      - MARIADB_USER=${MARIADB_USER:-simak}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD:-simak}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-rootsecret}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3309:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  storage:
    image: rustfs/rustfs:latest
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfsadmin}
    volumes:
      - rustfs_data:/data
    ports:
      - "127.0.0.1:9013:9000"
      - "127.0.0.1:9014:9001"
    restart: unless-stopped

  proxy:
    image: caddy:2
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN:-simak.localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  db_data:
  rustfs_data:
  caddy_data:
  caddy_config:
